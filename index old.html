<!doctype html>
<html lang="kk">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Батыс Қазақстан облысының мектептерінің дамуы</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/styles/style.css">
    <link rel="stylesheet" href="/styles/header.css">
    <link rel="stylesheet" href="/styles/main.css">
    <link rel="stylesheet" href="/styles/footer.css">
    <link rel="stylesheet" href="/styles/adaptive.css">
    <link rel="shortcut icon" href="./images/icon.webp" type="image/x-icon">
    <style>
        .header {
            background-color: rgba(6, 20, 58, .92);
        }
        /* ===== Мобильная адаптация ===== */
        
        html {
            -webkit-text-size-adjust: 100%;
        }
        
        img,
        svg {
            max-width: 100%;
        }
        
        body {
            overflow-x: hidden;
        }
        
        @media (max-width: 900px) {
            .footer__top {
                flex-wrap: wrap;
                gap: 24px;
            }
            .footer__nav {
                flex-wrap: wrap;
                gap: 12px 20px;
            }
        }
        
        @media (max-width: 768px) {
            .logo {
                min-width: 0;
            }
            .logo__text {
                font-size: 15px;
                line-height: 1.2;
            }
            .logo__text small {
                font-size: 11px;
                display: block;
            }
            /* Выпадающее меню: место задаёт top, transform только для анимации */
            .header__inner {
                position: relative;
            }
            .header .nav {
                position: absolute !important;
                top: 100% !important;
                left: 0 !important;
                right: 0 !important;
                width: 100% !important;
                display: flex !important;
                flex-direction: column !important;
                gap: 0 !important;
                margin: 0 !important;
                padding: 0 !important;
                background: rgba(6, 20, 58, .98) !important;
                max-height: calc(100vh - var(--header-h));
                overflow-y: auto;
                transform: translateY(-16px) !important;
                opacity: 0;
                visibility: hidden;
                pointer-events: none;
                transition: transform .25s ease, opacity .25s ease, visibility .25s;
            }
            .header .nav.open {
                transform: translateY(0) !important;
                opacity: 1;
                visibility: visible;
                pointer-events: auto;
            }
            .header .nav a {
                padding: 16px 20px;
                font-size: 16px;
                border-bottom: 1px solid rgba(255, 255, 255, .08);
            }
            /* Слайдер */
            .hero {
                height: auto;
                min-height: 0;
                aspect-ratio: 16 / 10;
            }
            .hero .slide,
            .hero .slide img {
                width: 100%;
                height: 100%;
                object-fit: contain;
                margin-top: 11px;
            }
            .arrow {
                width: 36px;
                height: 36px;
                font-size: 16px;
            }
            .arrow--prev {
                left: 8px;
            }
            .arrow--next {
                right: 8px;
            }
            .dots {
                bottom: 10px;
            }
            /* Подвал */
            .footer__inner {
                padding: 28px 16px;
            }
            .footer__top {
                flex-direction: column;
                align-items: flex-start;
                gap: 20px;
            }
            .footer__nav {
                flex-direction: column;
                gap: 10px;
            }
            .footer__bottom {
                flex-direction: column;
                gap: 6px;
                text-align: left;
                font-size: 13px;
            }
        }
        
        @media (max-width: 480px) {
            .logo__text {
                font-size: 14px;
            }
            .hero {
                aspect-ratio: 4 / 3;
            }
        }
    </style>
</head>

<body>
    <header class="header">
        <div class="header__inner">
            <a href="index.html" class="logo">
                <span class="logo__icon">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#ffe27a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M3 21h18M5 21V10l7-5 7 5v11M9 21v-6h6v6M12 5V2l3 1.5L12 5"/>
                    </svg>
                </span>
                <span class="logo__text">
                    БҚО мектептері
                    <small>Мектептердің даму картасы</small>
                </span>
            </a>

            <nav class="nav" id="nav">
                <!-- <a href="#">Басты бет</a> -->
                <a href="./schools.html">38 жаңа мектеп</a>
                <a href="./emergency-schools.html">Апатты мектептер</a>
                <a href="./shifts.html">Үш ауысымды</a>
                <a href="./result.html">Талдау</a>
                <!-- <a href="zko_map.html" class="btn-map">Карта</a> -->
            </nav>

            <button class="burger" id="burger" aria-label="Мәзір">
                <span></span><span></span><span></span>
            </button>
        </div>
    </header>

    <section class="hero" id="hero">
        <div class="slide active"><img src="/images/slide1.webp" alt="Слайд 1"></div>
        <div class="slide"><img src="/images/slide2.webp" alt="Слайд 2"></div>
        <div class="slide"><img src="/images/slide3.webp" alt="Слайд 3"></div>

        <button class="arrow arrow--prev" aria-label="Алдыңғы">&#10094;</button>
        <button class="arrow arrow--next" aria-label="Келесі">&#10095;</button>

        <div class="dots"></div>
    </section>

    <footer class="footer">
        <div class="footer__inner">

            <div class="footer__top">

                <!-- Логотип -->
                <a href="/" class="logo footer__logo">
                    <span class="logo__icon">
                    <svg width="24" height="24" viewBox="0 0 24 24"
                         fill="none" stroke="#ffe27a" stroke-width="2"
                         stroke-linecap="round" stroke-linejoin="round">
                        <path d="M3 21h18M5 21V10l7-5 7 5v11M9 21v-6h6v6M12 5V2l3 1.5L12 5"/>
                    </svg>
                </span>

                    <span class="logo__text">
                    БҚО мектептері
                    <small>Мектептердің даму картасы</small>
                </span>
                </a>

                <!-- Навигация -->
                <nav class="footer__nav">
                    <a href="/">Басты бет</a>
                    <a href="./schools.html">Мектептер</a>
                    <a href="./emergency-schools.html">Апатты мектептер</a>
                    <a href="./shifts.html">Үш ауысымды</a>
                    <a href="./result.html">Талдау</a>
                </nav>

                <!-- Bilim -->
                <div class="footer__external">
                    <span>Ақпараттық ресурс</span>
                    <a href="#" target="_blank" rel="noopener noreferrer">
                    Bilim <span>↗</span>
                </a>
                </div>

            </div>

            <div class="footer__bottom">
                <p>© 2026 БҚО мектептері. Барлық құқықтар қорғалған.</p>
                <p>Батыс Қазақстан облысы</p>
            </div>

        </div>
    </footer>

    <script src="./js/app.js"></script>
</body>

</html>
