<!doctype html>
<html lang="kk">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Батыс Қазақстан облысының мектептерінің дамуы</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/styles/style.css">
    <link rel="stylesheet" href="/styles/header.css">
    <link rel="stylesheet" href="/styles/main.css">
    <link rel="stylesheet" href="/styles/footer.css">
    <link rel="stylesheet" href="/styles/adaptive.css">
    <link rel="shortcut icon" href="./images/icon.ico" type="image/x-icon">
    <style>
        .header {
            background-color: rgba(6, 20, 58, .92);
        }

        /* ===== Мобильная адаптация ===== */
        html { -webkit-text-size-adjust: 100%; }
        img, svg { max-width: 100%; }
        body { overflow-x: hidden; }

        /* Планшеты */
        @media (max-width: 900px) {
            .header__inner { padding-left: 16px; padding-right: 16px; gap: 12px; }
            .footer__top { flex-wrap: wrap; gap: 24px; }
            .footer__nav { flex-wrap: wrap; gap: 12px 20px; }
        }

        /* Телефоны */
        @media (max-width: 768px) {
            .header { position: sticky; top: 0; z-index: 1000; }
            .header__inner {
                display: flex;
                align-items: center;
                justify-content: space-between;
                padding: 10px 16px;
                position: relative;
            }
            .logo { min-width: 0; }
            .logo__text { font-size: 15px; line-height: 1.2; }
            .logo__text small { font-size: 11px; display: block; }

            /* Бургер-меню */
            .burger {
                display: flex !important;
                flex-direction: column;
                justify-content: center;
                gap: 5px;
                width: 44px;
                height: 44px;
                padding: 10px;
                background: none;
                border: 0;
                cursor: pointer;
                flex-shrink: 0;
            }
            .burger span {
                display: block;
                width: 100%;
                height: 2px;
                background: #ffe27a;
                border-radius: 2px;
                transition: transform .25s, opacity .25s;
            }
            .burger.is-open span:nth-child(1) { transform: translateY(7px) rotate(45deg); }
            .burger.is-open span:nth-child(2) { opacity: 0; }
            .burger.is-open span:nth-child(3) { transform: translateY(-7px) rotate(-45deg); }

            .nav {
                display: none !important;
                position: absolute;
                top: 100%;
                left: 0;
                right: 0;
                flex-direction: column;
                gap: 0;
                background: rgba(6, 20, 58, .98);
                border-top: 1px solid rgba(255, 255, 255, .1);
                box-shadow: 0 12px 24px rgba(0, 0, 0, .3);
            }
            .nav.is-open { display: flex !important; }
            .nav a {
                padding: 16px 20px;
                font-size: 16px;
                border-bottom: 1px solid rgba(255, 255, 255, .08);
            }

            /* Слайдер */
            .hero { height: auto; min-height: 0; aspect-ratio: 16 / 10; }
            .hero .slide, .hero .slide img {
                width: 100%;
                height: 100%;
                object-fit: cover;
            }
            .arrow { width: 36px; height: 36px; font-size: 16px; }
            .arrow--prev { left: 8px; }
            .arrow--next { right: 8px; }
            .dots { bottom: 10px; }

            /* Подвал */
            .footer__inner { padding: 28px 16px; }
            .footer__top {
                flex-direction: column;
                align-items: flex-start;
                gap: 20px;
            }
            .footer__nav { flex-direction: column; gap: 10px; }
            .footer__bottom {
                flex-direction: column;
                gap: 6px;
                text-align: left;
                font-size: 13px;
            }
        }

        /* Маленькие телефоны */
        @media (max-width: 480px) {
            .logo__text { font-size: 14px; }
            .logo__icon { transform: scale(.9); }
            .hero { aspect-ratio: 4 / 3; }
        }
    </style>
</head>

<body>
    <header class="header">
        <div class="header__inner">
            <a href="index.html" class="logo">
                <span class="logo__icon">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#ffe27a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M3 21h18M5 21V10l7-5 7 5v11M9 21v-6h6v6M12 5V2l3 1.5L12 5"/>
                    </svg>
                </span>
                <span class="logo__text">
                    БҚО мектептері
                    <small>Мектептердің даму картасы</small>
                </span>
            </a>

            <nav class="nav" id="nav">
                <!-- <a href="#">Басты бет</a> -->
                <a href="./schools.html">38 жаңа мектеп</a>
                <a href="./emergency-schools.html">Апатты мектептер</a>
                <a href="./shifts.html">Үш ауысымды</a>
                <a href="./result.html">Талдау</a>
                <!-- <a href="zko_map.html" class="btn-map">Карта</a> -->
            </nav>

            <button class="burger" id="burger" aria-label="Мәзір">
                <span></span><span></span><span></span>
            </button>
        </div>
    </header>

    <section class="hero" id="hero">
        <div class="slide active"><img src="/images/slide1.png" alt="Слайд 1"></div>
        <div class="slide"><img src="/images/slide2.png" alt="Слайд 2"></div>
        <div class="slide"><img src="/images/slide3.png" alt="Слайд 3"></div>

        <button class="arrow arrow--prev" aria-label="Алдыңғы">&#10094;</button>
        <button class="arrow arrow--next" aria-label="Келесі">&#10095;</button>

        <div class="dots"></div>
    </section>

    <footer class="footer">
        <div class="footer__inner">

            <div class="footer__top">

                <!-- Логотип -->
                <a href="/" class="logo footer__logo">
                    <span class="logo__icon">
                    <svg width="24" height="24" viewBox="0 0 24 24"
                         fill="none" stroke="#ffe27a" stroke-width="2"
                         stroke-linecap="round" stroke-linejoin="round">
                        <path d="M3 21h18M5 21V10l7-5 7 5v11M9 21v-6h6v6M12 5V2l3 1.5L12 5"/>
                    </svg>
                </span>

                    <span class="logo__text">
                    БҚО мектептері
                    <small>Мектептердің даму картасы</small>
                </span>
                </a>

                <!-- Навигация -->
                <nav class="footer__nav">
                    <a href="/">Басты бет</a>
                    <a href="./schools.html">Мектептер</a>
                    <a href="./emergency-schools.html">Апатты мектептер</a>
                    <a href="/#shifts">Үш ауысымды</a>
                    <a href="/#analysis">Талдау</a>
                    <!-- <a href="./zko_map.html">Карта</a> -->
                </nav>

                <!-- Bilim -->
                <div class="footer__external">
                    <span>Ақпараттық ресурс</span>
                    <a href="#" target="_blank" rel="noopener noreferrer">
                    Bilim <span>↗</span>
                </a>
                </div>

            </div>

            <div class="footer__bottom">
                <p>© 2026 БҚО мектептері. Барлық құқықтар қорғалған.</p>
                <p>Батыс Қазақстан облысы</p>
            </div>

        </div>
    </footer>

    <script src="./js/app.js"></script>
    <script>
        (function () {
            var burger = document.getElementById('burger');
            var nav = document.getElementById('nav');
            if (!burger || !nav) return;
            function setOpen(open) {
                burger.classList.toggle('is-open', open);
                nav.classList.toggle('is-open', open);
                burger.setAttribute('aria-expanded', open ? 'true' : 'false');
            }
            burger.addEventListener('click', function () {
                setOpen(!nav.classList.contains('is-open'));
            });
            nav.addEventListener('click', function (e) {
                if (e.target.closest('a')) setOpen(false);
            });
            window.addEventListener('resize', function () {
                if (window.innerWidth > 768) setOpen(false);
            });
        })();
    </script>
</body>

</html>
